pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

// foojay：让 build.gradle 的 java.toolchain 能在缺 JDK 时自动下载（本机系统 JDK 是 25，
// 而 1.20.1 线目标 Java 17，缺了 toolchain 会直接报「不支持发行版本」）。
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "mc-province-1.20.1"
