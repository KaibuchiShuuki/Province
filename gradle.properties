# TODO: 按需调整内存/并行配置。configuration-cache=false 是 loom 已知 issue #1349 的官方示例做法。
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 这里是唯一的真源：build.gradle 只负责把它们拼成产物名与依赖坐标。
minecraft_version=1.21.1
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.116.17+1.21.1

mod_version=0.2.1
group=com.mcprovince
# maven.fabricmc.net 直连偶尔会 Read timed out，把 HTTP 超时放宽一点
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
