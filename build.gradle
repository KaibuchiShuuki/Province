plugins {
    // 1.x 线（混淆时代）用带 -remap 后缀的 loom 插件；26.x 线才是原生 fabric-loom。
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

// group 与 mod_version 都从 gradle.properties 来，这里只拼产物名。
// Fabric 的惯例是「版本号 + MC 版本」：'+' 后面是构建元数据，游戏版本不同、模组版本可能相同，
// 所以产物名必须带出来，玩家一眼就知道这个 jar 是给哪一版游戏用的。
// 产物固定叫 Province-<版本>+<MC 版本>.jar（默认会跟 settings.gradle 里的工程目录名走，
// 那样出来的是 mc-province-1.21.11-x.y.z.jar）。
version = "${mod_version}+${minecraft_version}"
base {
    archivesName = "Province"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 1.x 线必须写映射：这里用官方 Mojang 映射（mojmap）。
    // 这是刻意的选择——26.2 那边因为 26.1 起不再混淆，官方类名直接可用；
    // 1.x 线经 loom 用同一套官方名反混淆后，两边的类名/方法名才对得上。
    mappings loom.officialMojangMappings()

    // 1.x 线的模组依赖配置是 modImplementation（26.x 线已并入普通 implementation）。
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    // Fabric API 走 maven 坐标：它的子模块是塞在 jar 里的嵌套 jar，只有坐标形式
    // 才会被拆开进 classpath；写成 files(...) 编译期会找不到
    // net.fabricmc.fabric.api.* 那些包。
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Xaero 的 World Map 仅作为编译期参照（mixin 目标 + 集成 API）。
    // 运行时由用户在 mods 目录提供，故不打包进本模组。
    // 必须用 modCompileOnly 而不是 compileOnly：1.x 线的第三方模组 jar 里是 intermediary 名
    // （net.minecraft.class_243 之类），只有经 loom 的 remapper 过一遍才能和本项目的 mojmap 对上，
    // 否则 javac 会报「无法访问 net.minecraft.class_2378」。
    modCompileOnly files('_refs/xaeroworldmap-fabric-1.21.11-1.47.0.jar')

    // 小地图同理：区划图层是靠 mixin 挂进它的渲染循环，编译期只需要它的类；
    // 玩家没装小地图时那份 mixin 配置是 required=false，会被静默跳过。
    // ModuleRenderContext 这类公共件在 xaerolib 里，两个 jar 都要给。
    modCompileOnly files('_refs/xaerominimap-fabric-1.21.11-26.6.0.jar')
    modCompileOnly files('_refs/xaerolib-fabric-1.21.11-1.7.3.jar')
}

processResources {
    filesMatching('fabric.mod.json') {
        expand "version": version
    }
}

// 目标 Java 版本用 toolchain 声明（不是 options.release + source/targetCompatibility）：
// 环境 JDK 低于目标时只有 toolchain 才会让 foojay 自动 provision 对应 JDK；
// 否则 javac 会直接报「不支持发行版本 21」。
java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
